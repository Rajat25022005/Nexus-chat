version: '3.9'

services:
  # ── Qdrant Vector Database ──
  # (Can be moved to a managed Qdrant Cloud cluster in the future)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  # ── Microservices ──
  nexus-api:
    build:
      context: ./services/nexus-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env.production
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nexus-socket:
    build:
      context: ./services/nexus-socket
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file: .env.production
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  nexus-rag:
    build:
      context: .
      dockerfile: services/nexus-rag/Dockerfile
    ports:
      - "50051:50051"
      - "8000:8000"
    env_file: .env.production
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    volumes:
      - ./services/nexus-rag/app:/app/app
    restart: always

  nexus-ai-gateway:
    build:
      context: .
      dockerfile: services/nexus-ai-gateway/Dockerfile
    ports:
      - "8081:8081"
    env_file: .env.production
    restart: always

  nexus-ai-worker:
    build:
      context: .
      dockerfile: services/nexus-ai-worker/Dockerfile
    env_file: .env.production
    restart: always

  nexus-billing:
    build:
      context: .
      dockerfile: services/nexus-billing/Dockerfile
    ports:
      - "8082:8082"
    env_file: .env.production
    restart: always

volumes:
  qdrant_storage:

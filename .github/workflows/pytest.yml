name: Python Tests

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Provide a local MongoDB instance for the tests
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx fastapi
          if [ -f nexus-rag/requirements.txt ]; then pip install -r nexus-rag/requirements.txt; fi
          
      - name: Run pytest
        env:
          MONGO_URI: "mongodb://localhost:27017"
          MONGO_DB_NAME: "nexus_test"
          JWT_SECRET: "test_secret_key_123456789"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "test"
          ALLOWED_ORIGINS: "*"
        run: |
          cd nexus-rag
          PYTHONPATH=. pytest ../tests/ --log-cli-level=INFO
